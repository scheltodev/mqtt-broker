# ==============================================================================
# ESPHome Konfiguration — Pflanzen-Gießmonitoring 2.0
# ==============================================================================
# Hardware: ESP32-WROOM-32 mit 1x Capacitive Soil Moisture Sensor v1.2
# ==============================================================================

esphome:
  name: plant-monitor
  friendly_name: "Pflanzen-Gießmonitoring"
  comment: "Bodenfeuchtemonitoring für Efeutute"

esp32:
  board: esp32dev
  framework:
    type: arduino

# ==============================================================================
# WLAN & OTA (Over-The-Air Updates)
# ==============================================================================
wifi:
  power_save_mode: none
  networks:
    - ssid: "MachuPichu_EXT"
      password: "neuland1337"
      priority: 10.0
    - ssid: "MachuPichu"
      password: "neuland1337"
      priority: 5.0

  # Fallback-Hotspot, falls WLAN nicht erreichbar ist
  ap:
    ssid: "Plant-Monitor-Fallback"
    password: "scanemall-setup"

captive_portal:

# Aktiviert drahtlose Firmware-Updates nach dem ersten USB-Flash
ota:
  platform: esphome

# Webserver auf dem ESP32 (unter http://<esp32-ip> im Browser erreichbar)
web_server:
  port: 80

# Serielle Schnittstelle für Debugging im Terminal
logger:
  level: INFO

# ==============================================================================
# MQTT Broker (Verbindung zu scanemall-infra)
# ==============================================================================
mqtt:
  broker: 192.168.178.149
  port: 30605
  topic_prefix: plants
  keepalive: 60s
  reboot_timeout: 0s
  birth_message:
    topic: plants/status
    payload: "online"
  will_message:
    topic: plants/status
    payload: "offline"

# ==============================================================================
# Sensoren
# ==============================================================================
sensor:
  # ----------------------------------------------------------------------------
  # Sensor: Efeutute (Pin 34)
  # ----------------------------------------------------------------------------
  # 1. Hardware ADC liest die Rohspannung (V)
  - platform: adc
    pin: GPIO34
    name: "Efeutute Rohspannung"
    id: efeutute_voltage
    attenuation: 12db
    update_interval: 60s
    unit_of_measurement: "V"
    accuracy_decimals: 2
    force_update: true
    filters:
      - median:
          window_size: 5
          send_every: 1

  # 2. Template-Sensor rechnet die Rohspannung in kalibrierte Feuchtigkeit (%) um
  - platform: template
    name: "Efeutute Feuchtigkeit"
    id: efeutute_moisture
    update_interval: 60s
    unit_of_measurement: "%"
    accuracy_decimals: 1
    force_update: true
    icon: "mdi:water-percent"
    lambda: |-
      float v = id(efeutute_voltage).state;
      if (isnan(v)) return {};
      // Kalibrierung: 2.23V (Luft) = 0%, 1.09V (Wasser) = 100%
      float v_dry = 2.23;
      float v_wet = 1.09;
      float pct = (v_dry - v) / (v_dry - v_wet) * 100.0;
      if (pct < 0.0) pct = 0.0;
      if (pct > 100.0) pct = 100.0;
      return pct;

  # ----------------------------------------------------------------------------
  # System-Diagnose: WLAN-Signal & Uptime
  # ----------------------------------------------------------------------------
  - platform: wifi_signal
    name: "ESP32 WiFi Signal"
    update_interval: 60s
    force_update: true

  - platform: uptime
    name: "ESP32 Uptime"
    update_interval: 60s
    force_update: true

# ==============================================================================
# BATTERIE-MODUS (OPTIONAL):
# Sobald du den ESP32 an Akku/Powerbank betreiben willst, kommentiere
# diesen Block ein. Der ESP32 wacht alle 30 Minuten auf, sendet und schläft wieder.
# ==============================================================================
# deep_sleep:
#   run_duration: 30s
#   sleep_duration: 30min
