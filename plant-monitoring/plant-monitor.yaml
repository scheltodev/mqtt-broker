# ==============================================================================
# ESPHome Konfiguration — Pflanzen-Gießmonitoring 2.0
# ==============================================================================
# Hardware: ESP32-WROOM-32 mit 3x Capacitive Soil Moisture Sensor v1.2
# ==============================================================================

esphome:
  name: plant-monitor
  friendly_name: "Pflanzen-Gießmonitoring"
  comment: "Bodenfeuchtemonitoring für Efeutute, Efeu und Drachenbaum"

esp32:
  board: esp32dev
  framework:
    type: arduino

# ==============================================================================
# WLAN & OTA (Over-The-Air Updates)
# ==============================================================================
wifi:
  ssid: "WLAN-504009_EXT"
  password: "2764193621847697"

  # Fallback-Hotspot, falls WLAN nicht erreichbar ist
  ap:
    ssid: "Plant-Monitor-Fallback"
    password: "scanemall-setup"

captive_portal:

# Aktiviert drahtlose Firmware-Updates nach dem ersten USB-Flash
ota:
  platform: esphome

# Webserver auf dem ESP32 (unter http://<esp32-ip> im Browser erreichbar)
web_server:
  port: 80

# Serielle Schnittstelle für Debugging im Terminal
logger:
  level: INFO

# ==============================================================================
# MQTT Broker (Verbindung zu scanemall-infra)
# ==============================================================================
mqtt:
  broker: 192.168.2.8
  port: 30605
  topic_prefix: plants
  birth_message:
    topic: plants/status
    payload: "online"
  will_message:
    topic: plants/status
    payload: "offline"

# ==============================================================================
# Sensoren
# ==============================================================================
sensor:
  # ----------------------------------------------------------------------------
  # Pflanze 1: Efeutute (Pin 34)
  # ----------------------------------------------------------------------------
  # 1. Hardware ADC liest die Rohspannung (V)
  - platform: adc
    pin: GPIO34
    name: "Efeutute Rohspannung"
    id: efeutute_voltage
    attenuation: 12db
    update_interval: 60s
    unit_of_measurement: "V"
    accuracy_decimals: 2
    filters:
      - median:
          window_size: 15
          send_every: 1

  # 2. Template-Sensor rechnet die Rohspannung in kalibrierte Feuchtigkeit (%) um
  - platform: template
    name: "Efeutute Feuchtigkeit"
    id: efeutute_moisture
    unit_of_measurement: "%"
    accuracy_decimals: 1
    icon: "mdi:water-percent"
    lambda: |-
      float v = id(efeutute_voltage).state;
      if (isnan(v)) return {};
      // Kalibrierung: 2.80V (Luft) = 0%, 1.35V (Wasser) = 100%
      float v_dry = 2.80;
      float v_wet = 1.35;
      float pct = (v_dry - v) / (v_dry - v_wet) * 100.0;
      if (pct < 0.0) pct = 0.0;
      if (pct > 100.0) pct = 100.0;
      return pct;

  # ----------------------------------------------------------------------------
  # Pflanze 2: Efeu (Pin 35)
  # ----------------------------------------------------------------------------
  - platform: adc
    pin: GPIO35
    name: "Efeu Rohspannung"
    id: efeu_voltage
    attenuation: 12db
    update_interval: 60s
    unit_of_measurement: "V"
    accuracy_decimals: 2
    filters:
      - median:
          window_size: 15
          send_every: 1

  - platform: template
    name: "Efeu Feuchtigkeit"
    id: efeu_moisture
    unit_of_measurement: "%"
    accuracy_decimals: 1
    icon: "mdi:water-percent"
    lambda: |-
      float v = id(efeu_voltage).state;
      if (isnan(v)) return {};
      float v_dry = 2.80;
      float v_wet = 1.35;
      float pct = (v_dry - v) / (v_dry - v_wet) * 100.0;
      if (pct < 0.0) pct = 0.0;
      if (pct > 100.0) pct = 100.0;
      return pct;

  # ----------------------------------------------------------------------------
  # Pflanze 3: Drachenbaum (Pin 32)
  # ----------------------------------------------------------------------------
  - platform: adc
    pin: GPIO32
    name: "Drachenbaum Rohspannung"
    id: drachenbaum_voltage
    attenuation: 12db
    update_interval: 60s
    unit_of_measurement: "V"
    accuracy_decimals: 2
    filters:
      - median:
          window_size: 15
          send_every: 1

  - platform: template
    name: "Drachenbaum Feuchtigkeit"
    id: drachenbaum_moisture
    unit_of_measurement: "%"
    accuracy_decimals: 1
    icon: "mdi:water-percent"
    lambda: |-
      float v = id(drachenbaum_voltage).state;
      if (isnan(v)) return {};
      float v_dry = 2.80;
      float v_wet = 1.35;
      float pct = (v_dry - v) / (v_dry - v_wet) * 100.0;
      if (pct < 0.0) pct = 0.0;
      if (pct > 100.0) pct = 100.0;
      return pct;

  # ----------------------------------------------------------------------------
  # System-Diagnose: WLAN-Signal & Uptime
  # ----------------------------------------------------------------------------
  - platform: wifi_signal
    name: "ESP32 WiFi Signal"
    update_interval: 60s

  - platform: uptime
    name: "ESP32 Uptime"
    update_interval: 300s

# ==============================================================================
# BATTERIE-MODUS (OPTIONAL):
# Sobald du den ESP32 an Akku/Powerbank betreiben willst, kommentiere
# diesen Block ein. Der ESP32 wacht alle 30 Minuten auf, sendet und schläft wieder.
# ==============================================================================
# deep_sleep:
#   run_duration: 30s
#   sleep_duration: 30min
